services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sustainabuild
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: sustainabuild
      CORE_API_JWT_SECRET: ${CORE_API_JWT_SECRET:-change-me-in-production-32chars!!}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CORE_API_URL: http://core-api:4000/graphql
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-must-be-32-chars-long!!}
      CORE_API_JWT_SECRET: ${CORE_API_JWT_SECRET:-change-me-in-production-32chars!!}
    depends_on:
      core-api:
        condition: service_healthy

volumes:
  mongodb_data:
