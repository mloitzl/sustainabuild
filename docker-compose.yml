services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/keyfile/mongo-keyfile"]
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/data/keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    user: "999:999"
    healthcheck:
      test: >
        mongosh --username ${MONGO_USER} --password ${MONGO_PASS}
        --authenticationDatabase admin --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Generates the replica-set keyfile (shared volume) then calls rs.initiate().
  # MongoDB cannot start without the keyfile, so it restarts until this writes it.
  # Bootstrap: init generates keyfile → mongo restarts → init polls until ready →
  # init runs rs.initiate() → exits 0 → core-api starts.
  mongodb-init:
    image: mongo:7
    depends_on:
      - mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - ./infra/mongodb/init-replica-set.sh:/init-replica-set.sh:ro
      - mongodb_keyfile:/data/keyfile
    entrypoint: ["/bin/bash", "/init-replica-set.sh"]
    restart: on-failure

  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/sustainabuild?authSource=admin&replicaSet=rs0
      MONGO_DB: sustainabuild
      CORE_API_JWT_SECRET: ${CORE_API_JWT_SECRET:-change-me-in-production-32chars!!}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  authentik-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL_DB:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-authentik}
    volumes:
      - authentik_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL_USER:-authentik} -d ${AUTHENTIK_POSTGRESQL_DB:-authentik}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-latest}
    restart: unless-stopped
    command: server
    ports:
      - "9000:9000"
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-replace-with-a-strong-random-authentik-secret}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_USERNAME: ${AUTHENTIK_BOOTSTRAP_USERNAME:-akadmin}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-changeme}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-changeme-token}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/-/health/ready/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-latest}
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-replace-with-a-strong-random-authentik-secret}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
      authentik-server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CORE_API_URL: http://core-api:4000/graphql
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-must-be-32-chars-long!!}
      CORE_API_JWT_SECRET: ${CORE_API_JWT_SECRET:-change-me-in-production-32chars!!}
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-local,oidc}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Authentik}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://authentik-server:9000/application/o/sustainabuild/}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://authentik-server:9000/application/o/.well-known/openid-configuration}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sustainabuild-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
    depends_on:
      core-api:
        condition: service_healthy
      authentik-server:
        condition: service_started

volumes:
  mongodb_data:
  mongodb_keyfile:
  authentik_postgresql_data:
  authentik_media:
  authentik_templates:
