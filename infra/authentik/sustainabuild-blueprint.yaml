version: 1
metadata:
  name: SustainaBuild OIDC bootstrap
  labels:
    blueprints.goauthentik.io/description: Bootstrap SustainaBuild OAuth2/OIDC provider and application
context:
  app_name: SustainaBuild
  app_slug: sustainabuild
  client_id: !Env [OIDC_CLIENT_ID, "sustainabuild-web"]
  client_secret: !Env [OIDC_CLIENT_SECRET, "change-me"]
  redirect_uri_localhost: !Env [OIDC_REDIRECT_URI, "http://localhost:3000/api/auth/callback?provider=oidc"]
  redirect_uri_loopback: !Env [OIDC_REDIRECT_URI_ALT, "http://127.0.0.1:3000/api/auth/callback?provider=oidc"]
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: sustainabuild-oidc-provider
    identifiers:
      name: SustainaBuild OIDC Provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: !Context client_id
      client_secret: !Context client_secret
      redirect_uris:
        - matching_mode: strict
          url: !Context redirect_uri_localhost
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Context redirect_uri_loopback
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: !Context app_slug
    attrs:
      name: !Context app_name
      provider: !KeyOf sustainabuild-oidc-provider
